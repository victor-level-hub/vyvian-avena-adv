# Regenera a narração de um artigo JÁ publicado (correções de pronúncia,
# ajustes ao guião falado, etc.) sem passar pela fila do Insights.
# Correr à mão: Actions → "Regenerar áudio de artigo" → Run workflow → slug.
name: Regenerar áudio de artigo
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug do artigo (src/content/blog/<slug>.md)'
        required: true
permissions:
  contents: write
concurrency: publicar
jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Narração com timestamps (leitura acompanhada)
        run: node scripts/gerar-audio-blogue.mjs --slug "${{ github.event.inputs.slug }}" --model turbo
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - name: Commit do áudio
        run: |
          git config user.name "vyvian-publicador"
          git config user.email "publicador@vyavenaadv.com"
          git add public/blog-audio
          git commit -m "Regenerar narração: ${{ github.event.inputs.slug }} [skip ci]"
          git push
      - name: Build
        run: npm run build
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
